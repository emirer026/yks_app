name: yks_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.2
  google_mobile_ads: ^9.0.0
  firebase_core: ^3.10.1
  firebase_auth: ^5.3.4
  file_selector: ^1.0.3
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5
  cloud_firestore: ^5.6.12
  intl: ^0.20.3
  image_picker: ^1.2.3
  pdfrx: ^2.5.0
  path_provider: ^2.1.4
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/background.png
    - assets/logo.png
    - assets/icon.png
    - assets/images/1.jpg
    - assets/images/2.jpg
    - assets/images/3.jpg
    - assets/images/4.jpg
    - assets/images/5.jpg
    - assets/images/6.jpg
    - assets/images/7.jpg
    - assets/images/8.jpg
    - assets/images/9.jpg
    - assets/images/10.jpg
    - assets/images/11.jpg
    - assets/images/12.jpg
    - assets/images/13.jpg
    - assets/images/14.jpg
    - assets/images/15.jpg
    - assets/images/16.jpg
    - assets/images/17.jpg
    - assets/images/18.jpg
    - assets/images/19.jpg
    - assets/images/20.jpg

flutter_native_splash:
  color: "#F6C1CC"
  fullscreen: true

flutter_icons:
  image_path: "assets/icon.png"
  android: true
  ios: true
  image_path_android: "assets/icon.png"